<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FormPilot — Profile Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>
        </span>
        <div class="brand-text">
          <div class="brand-name">FormPilot</div>
          <div class="brand-tagline">Your reusable info, filled anywhere</div>
        </div>
      </div>

      <div class="header-search">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="searchInput" placeholder="Search fields by name, value, or keyword…" aria-label="Search fields" />
      </div>
    </header>

    <div class="app-body">
      <nav class="sidebar" id="sidebar" aria-label="Field categories"></nav>

      <main class="content">
        <div class="content-header">
          <h1 id="categoryTitle">Identity</h1>
          <button type="button" id="addFieldBtn" class="btn btn-primary">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add Field
          </button>
        </div>

        <div class="field-grid" id="fieldGrid"></div>

        <div class="empty-state" id="emptyState" hidden>
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
          </div>
          <p class="empty-title" id="emptyTitle">No fields yet</p>
          <p class="empty-subtitle" id="emptySubtitle">Add your first field to start auto-filling forms.</p>
          <button type="button" id="emptyAddBtn" class="btn btn-primary">Add Field</button>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Add Field</h2>
        <button type="button" class="icon-btn" id="modalCloseBtn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="fieldForm" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label for="fieldLabel">Label</label>
            <input type="text" id="fieldLabel" placeholder="e.g. LinkedIn URL" />
          </div>

          <div class="form-group">
            <label for="fieldValue">Value</label>
            <textarea id="fieldValue" rows="2" placeholder="e.g. https://linkedin.com/in/yourname"></textarea>
          </div>

          <div class="form-group">
            <label for="fieldCategory">Category</label>
            <select id="fieldCategory"></select>
          </div>

          <div class="form-group">
            <label for="fieldKeywords">Keywords</label>
            <input type="text" id="fieldKeywords" placeholder="linkedin, li profile, linkedin url" />
            <p class="helper-text">Other ways this field might be labeled on forms, e.g. "linkedin, li profile, linkedin url".</p>
          </div>

          <label class="checkbox-field">
            <input type="checkbox" id="fieldSensitive" />
            <span>
              <strong>Mark as sensitive</strong>
              <small>Sensitive fields won't be included in one-click Fill All — you'll confirm them individually.</small>
            </span>
          </label>

          <p class="form-error" id="formError" hidden>Label and value can't be empty.</p>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="options.js"></script>
</body>
</html>
